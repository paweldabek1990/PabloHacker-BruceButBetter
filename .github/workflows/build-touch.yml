name: Build ESP32-S3 DIY Touch

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-touch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio/libdeps
          key: platformio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'boards/esp32-s3-n16r8-ili9341-touch/**') }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Build maintained target
        run: pio run -e esp32-s3-n16r8-ili9341-touch
