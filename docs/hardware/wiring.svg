<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <rect width="1200" height="900" fill="#f7f7f7"/>
  <style>text{font-family:Arial,sans-serif;fill:#17202a} .h{font-size:28px;font-weight:700}.s{font-size:18px}.u{fill:#fff3cd;stroke:#b8860b;stroke-width:2}.e{fill:#e8f5e9;stroke:#2e7d32;stroke-width:2}.w{stroke:#3949ab;stroke-width:3;fill:none}</style>
  <text x="40" y="50" class="h">BruceButBetter DIY Touch — verified wiring</text>
  <text x="40" y="82" class="s">Programmed GPIO and user-confirmed TFT/touch connections. Physical board header pin numbers are not inferred.</text>
  <rect x="55" y="125" width="320" height="560" rx="16" class="e"/><text x="85" y="170" class="h">ESP32-S3 N16R8</text><text x="85" y="205" class="s">USB-C: native USB / UART bridge</text>
  <text x="85" y="255" class="s">GPIO 11  SPI MOSI</text><text x="85" y="290" class="s">GPIO 12  SPI SCK</text><text x="85" y="325" class="s">GPIO 13  SPI MISO</text><text x="85" y="360" class="s">GPIO 15  TFT CS</text><text x="85" y="395" class="s">GPIO 16  TFT RST</text><text x="85" y="430" class="s">GPIO 17  TFT DC</text><text x="85" y="465" class="s">GPIO 10  TOUCH CS</text><text x="85" y="500" class="s">3V3 / GND</text>
  <rect x="825" y="125" width="320" height="360" rx="16" class="u"/><text x="855" y="170" class="h">TPM408-2.8 TFT</text><text x="855" y="210" class="s">ILI9341, 240×320</text><text x="855" y="250" class="s">SCK ← GPIO12</text><text x="855" y="285" class="s">SDA/MOSI ← GPIO11</text><text x="855" y="320" class="s">SDO/MISO ← GPIO13</text><text x="855" y="355" class="s">CS ← GPIO15</text><text x="855" y="390" class="s">DC ← GPIO17</text><text x="855" y="425" class="s">RESET ← GPIO16</text><text x="855" y="460" class="s">VCC/LED ← 3V3; GND ← GND</text>
  <rect x="825" y="540" width="320" height="240" rx="16" class="u"/><text x="855" y="585" class="h">XPT2046 touch</text><text x="855" y="625" class="s">T_CLK ← GPIO12</text><text x="855" y="660" class="s">T_DIN ← GPIO11</text><text x="855" y="695" class="s">T_DO ← GPIO13</text><text x="855" y="730" class="s">T_CS ← GPIO10</text><text x="855" y="765" class="s">T_IRQ: NC (not connected)</text>
  <path d="M375 255 H825 M375 290 H825 M375 325 H825 M375 360 H825 M375 395 H825 M375 430 H825 M375 465 H825" class="w"/>
  <text x="55" y="750" class="s">Other configured SPI CS: SD GPIO14; CC1101 GPIO3 (target override); NRF24 #1 CSN GPIO5/CE GPIO4; NRF24 #2 CSN GPIO7/CE GPIO6.</text>
  <text x="55" y="785" class="s">Known configuration conflicts: GPIO15/16 also appear in inherited button definitions; CC1101 default 10 is overridden to 3 for this target.</text>
  <text x="55" y="820" class="s">Not shown as verified: physical ESP32 header pin numbers, TFT backlight control pin (software TFT_BL=-1), SD physical wiring.</text>
</svg>
