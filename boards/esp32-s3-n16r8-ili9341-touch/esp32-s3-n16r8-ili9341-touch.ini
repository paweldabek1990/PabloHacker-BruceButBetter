[env:esp32-s3-n16r8-ili9341-touch]
extends = env:esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.partitions = custom_16Mb.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_src_filter = ${env.build_src_filter} +<../boards/esp32-s3-n16r8-ili9341-touch>
build_flags =
    ${env.build_flags}
    -Iboards/esp32-s3-n16r8-ili9341-touch
    -DCORE_DEBUG_LEVEL=0
    -DDEVICE_NAME='"BruceButBetter TPM408"'
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSB_as_HID=1
    -DGROVE_SDA=8
    -DGROVE_SCL=18
    -DHAS_SCREEN=1
    -DHAS_TOUCH=1
    -DUSE_TFT_eSPI_TOUCH=1
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DSPI_FREQUENCY=10000000
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=13
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=15
    -DTFT_DC=17
    -DTFT_RST=16
    -DTOUCH_CS=10
    -DSPI_TOUCH_FREQUENCY=2500000
    -DTFT_BL=-1
    -DBACKLIGHT=-1
    -DTFT_BRIGHT_FREQ=5000
    -DTFT_BRIGHT_Bits=8
    -DSMOOTH_FONT=1
    -DROTATION=1
    -DSPI_MOSI_PIN=11
    -DSPI_SCK_PIN=12
    -DSPI_MISO_PIN=13
    -DSPI_SS_PIN=10
    -DUSE_CC1101_VIA_SPI
    -DCC1101_GDO0_PIN=9
    -DCC1101_SS_PIN=3
    -DCC1101_MOSI_PIN=11
    -DCC1101_SCK_PIN=12
    -DCC1101_MISO_PIN=13
    -DUSE_NRF24_VIA_SPI
    -DNRF24_CE_PIN=4
    -DNRF24_SS_PIN=5
    -DNRF24_MOSI_PIN=11
    -DNRF24_SCK_PIN=12
    -DNRF24_MISO_PIN=13
    -DNRF24_2_CE_PIN=6
    -DNRF24_2_SS_PIN=7
    -DSDCARD_CS=14
    -DSDCARD_MOSI=11
    -DSDCARD_SCK=12
    -DSDCARD_MISO=13
    -DRXLED=1
    -DTXLED=2
    -DIR_TX_PINS='{{"IR TX", 2}}'
    -DIR_RX_PINS='{{"IR RX", 1}}'
    -DRF_TX_PINS='{{"RF TX", 2}}'
    -DRF_RX_PINS='{{"RF RX", 1}}'
    -DBUZZ_PIN=47
    -DBRUCE_FONT_P=1
    -DBRUCE_FONT_M=2
    -DBRUCE_FONT_G=3
    -DDISABLE_LORA
    -DDISABLE_GPS
    -DDISABLE_ETHERNET
    -DDISABLE_FM
    -DSERIAL_TX=43
    -DSERIAL_RX=44
lib_deps =
    ${env.lib_deps}
    etherkit/Etherkit Si5351@^2.1.4
lib_ignore =
